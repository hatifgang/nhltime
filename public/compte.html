<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon compte et abonnement VIP · NHL Time</title>
<meta name="description" content="Créez votre compte NHL Time et choisissez votre formule VIP : NHL, NBA, foot, tennis, paris du jour. Dès 15 € par mois.">
<link rel="canonical" href="https://hatifgang.github.io/nhltime/compte.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/nt.css">
</head>
<body>
<div class="wrap">
  <header class="bar"><a class="brand" href="./">NHL<span>Time</span></a><nav class="top-links"><a href="./">Direct</a><a href="vip.html">Pronos VIP</a><a href="mix.html">Paris du jour</a></nav></header>
  <h1>Mon compte</h1>
  <div id="app"><div class="card">Chargement…</div></div>
  <footer><a href="cgv.html">CGV</a> · <a href="mentions-legales.html">Mentions légales</a> · <a href="confidentialite.html">Confidentialité</a> · Jeu interdit aux mineurs. Joueurs Info Service : 09 74 75 13 13.</footer>
</div>
<nav class="bottom" aria-label="Navigation">
  <a href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Direct</a>
  <a href="vip.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Pronos VIP</a>
  <a href="mix.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Paris du jour</a>
  <a href="compte.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Compte</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js" onerror="void 0"></script>
<script src="paiement.js"></script>
<script src="js/nt.js"></script>
<script>
const $ = s => document.querySelector(s), esc = NT.esc, PAY = window.NT_PAIEMENT || {};
const fmtD = d => d ? new Date(d).toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'}) : '—';
const STAT = { en_attente: ['warn', 'En attente de validation'], actif: ['good', 'Actif'], refuse: ['bad', 'Refusé'], expire: ['', 'Expiré'] };
const catNom = id => NT.CATS.find(c => c.id === id)?.nom || id;

function authView(mode = 'login', msg = ''){
  $('#app').innerHTML = `<div class="card"><div class="tabs" role="tablist"><button role="tab" aria-selected="${mode==='login'}" data-m="login">Se connecter</button><button role="tab" aria-selected="${mode==='signup'}" data-m="signup">Créer un compte</button></div>
    <form id="f-auth"><label for="em">E-mail</label><input id="em" type="email" autocomplete="email" required>
    <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" minlength="8" required>
    ${mode==='signup' ? `<label style="font-weight:500;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="majeur" required style="margin-top:4px"> J’ai 18 ans ou plus et j’accepte les <a href="cgv.html" target="_blank">conditions générales de vente</a> et la <a href="confidentialite.html" target="_blank">politique de confidentialité</a>.</label>` : ''}
    <div class="msg" id="msg">${msg}</div>
    <button class="btn" type="submit">${mode==='signup' ? 'Créer mon compte' : 'Me connecter'}</button>
    ${mode==='login' ? ' <button class="btn ghost" type="button" id="forgot">Mot de passe oublié</button>' : ''}</form></div>
    <div class="card"><h2 style="margin-top:0">Les formules VIP</h2>${offersText()}</div>`;
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => authView(b.dataset.m));
  $('#f-auth').onsubmit = async e => {
    e.preventDefault(); const m = $('#msg'); m.className = 'msg'; m.textContent = '…';
    const email = $('#em').value.trim(), password = $('#pw').value;
    const r = mode === 'signup' ? await NT.sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } }) : await NT.sb.auth.signInWithPassword({ email, password });
    if (r.error) { m.className = 'msg err'; m.textContent = r.error.message.includes('Invalid login') ? 'E-mail ou mot de passe incorrect.' : r.error.message; return; }
    if (mode === 'signup' && !r.data.session) { m.className = 'msg ok'; m.textContent = 'Compte créé : ouvre l’e-mail de confirmation que tu viens de recevoir, puis connecte-toi.'; return; }
    main();
  };
  const fg = $('#forgot'); if (fg) fg.onclick = async () => {
    const email = $('#em').value.trim(), m = $('#msg');
    if (!email) { m.className = 'msg err'; m.textContent = 'Indique ton e-mail d’abord.'; return; }
    const { error } = await NT.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    m.className = error ? 'msg err' : 'msg ok'; m.textContent = error ? error.message : 'E-mail envoyé : suis le lien pour choisir un nouveau mot de passe.';
  };
}
function offersText(){
  return `<p><b>15 € par mois</b> pour une catégorie, <b>+5 €</b> par catégorie en plus, <b>+10 €</b> si le foot vient en plus.</p>
    <ul>${NT.CATS.map(c => `<li><b>${esc(c.nom)}</b> : ${esc(c.detail)}</li>`).join('')}</ul>
    <p class="sub">Exemples : NHL seul 15 € · NHL + NBA 20 € · NHL + foot 25 € · tout (5 catégories) 40 €. Abonnement de 30 jours, sans renouvellement automatique.</p>`;
}
async function main(){
  if (!NT.sb) { $('#app').innerHTML = `<div class="card"><b>L’espace abonnés est en cours d’activation.</b><p class="sub">Revenez très bientôt.</p>${offersText()}</div>`; return; }
  const u = await NT.user();
  if (!u) return authView();
  const [p, S] = await Promise.all([NT.profile(), NT.subs()]);
  const now = Date.now(), active = S.filter(s => s.statut === 'actif' && Date.parse(s.fin) >= now);
  const open = new Set(active.flatMap(s => s.categories));
  $('#app').innerHTML = `<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div><b>${esc(u.email)}</b><div class="sub">${p?.is_admin ? 'Administrateur · <a href="admin.html">valider les paiements</a>' : open.size ? 'Abonné VIP' : 'Compte gratuit'}</div></div><button class="btn ghost small" id="out">Se déconnecter</button></div></div>
    ${open.size ? `<div class="card"><h2 style="margin-top:0">Mes accès VIP</h2><ul>${[...open].map(c => { const k = NT.CATS.find(x => x.id === c); return `<li><b>${esc(k?.nom)}</b> : ${(k?.pages||[]).map(pg => `<a href="${pg}">${pg.replace('.html','').replace('hockey','KHL / Europe').replace('mix','Paris du jour').toUpperCase()}</a>`).join(' · ')}</li>`; }).join('')}</ul><p class="sub">Jusqu’au ${fmtD(Math.max(...active.map(s => Date.parse(s.fin))))}.</p></div>` : ''}
    ${S.length ? `<div class="card"><h2 style="margin-top:0">Mes demandes</h2><table><tr><th>Date</th><th>Formule</th><th>Prix</th><th>État</th><th>Fin</th></tr>${S.map(s => `<tr><td>${fmtD(s.created_at)}</td><td>${s.categories.map(catNom).join(' + ')}</td><td>${s.prix} €</td><td><span class="chip ${STAT[s.statut]?.[0]||''}">${STAT[s.statut]?.[1]||s.statut}</span></td><td>${s.statut==='actif' ? fmtD(s.fin) : '—'}</td></tr>`).join('')}</table></div>` : ''}
    <div class="card" id="formules"><h2 style="margin-top:0">${open.size ? 'Renouveler ou ajouter une formule' : 'Choisir ma formule VIP'}</h2>
      <div class="cats">${NT.CATS.map(c => `<label class="cat"><input type="checkbox" value="${c.id}"><span><b>${esc(c.nom)}</b><br><span class="sub">${esc(c.detail)}</span></span></label>`).join('')}</div>
      <div class="total"><span>Total</span><span id="tot">0 € / mois</span></div>
      <div class="sub" id="detail"></div>
      <h2>Moyen de paiement</h2>
      <div class="pay">${[['paypal','PayPal'],['revolut','Revolut'],['crypto','Crypto']].map(([k,l]) => `<label><input type="radio" name="pay" value="${k}" ${k==='paypal'?'checked':''}><span>${l}</span></label>`).join('')}</div>
      <div class="box" id="payinfo"></div>
      <label for="ref">Référence du paiement</label><input id="ref" type="text" placeholder="ID de transaction PayPal / Revolut, ou hash de la transaction crypto">
      <label style="font-weight:500;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="waiver" style="margin-top:4px"> Je demande l’accès immédiat aux contenus VIP dès la validation et je reconnais perdre mon droit de rétractation (<a href="cgv.html" target="_blank">CGV</a>, article 5).</label>
      <div class="msg" id="msg2"></div>
      <button class="btn" id="send">J’ai payé : envoyer ma demande</button>
      <p class="sub">Ton accès s’ouvre dès que le paiement est vérifié (${esc(PAY.delai || 'sous 24 h')}), pour 30 jours. Pas de renouvellement automatique.</p></div>`;
  $('#out').onclick = async () => { await NT.sb.auth.signOut(); main(); };
  const cats = () => [...document.querySelectorAll('.cat input:checked')].map(i => i.value);
  const method = () => document.querySelector('input[name=pay]:checked').value;
  const upd = () => {
    const c = cats(), total = NT.PRIX(c);
    $('#tot').textContent = `${total} € / mois`;
    $('#detail').textContent = c.length ? c.map((x, i) => `${catNom(x)}`).join(' + ') : 'Coche au moins une catégorie.';
    const m = method(), note = `Indique <b>${esc(u.email)}</b> en note du paiement.`;
    $('#payinfo').innerHTML = !total ? 'Choisis d’abord ta formule.' :
      m === 'paypal' ? (PAY.paypal ? `Envoie <b>${total} €</b> via PayPal : <a href="${esc(PAY.paypal)}${/paypal\.me/.test(PAY.paypal) ? '/' + total + 'EUR' : ''}" target="_blank" rel="noopener">payer avec PayPal</a>. ${note}` : 'PayPal bientôt disponible.') :
      m === 'revolut' ? (PAY.revolut ? `Envoie <b>${total} €</b> via Revolut : <a href="${esc(PAY.revolut)}" target="_blank" rel="noopener">payer avec Revolut</a>. ${note}` : 'Revolut bientôt disponible.') :
      ((PAY.crypto || []).filter(x => x.adresse).length ? `Envoie l’équivalent de <b>${total} €</b> à l’une de ces adresses, puis colle le hash de la transaction :<br>${PAY.crypto.filter(x => x.adresse).map(x => `<b>${esc(x.reseau)}</b> : <code>${esc(x.adresse)}</code>`).join('<br>')}<br><span class="sub">Vérifie bien le réseau : un envoi sur le mauvais réseau est perdu.</span>` : 'Paiement crypto bientôt disponible.');
  };
  document.querySelectorAll('.cat input, input[name=pay]').forEach(i => i.onchange = upd); upd();
  $('#send').onclick = async () => {
    const c = cats(), ref = $('#ref').value.trim(), m = $('#msg2');
    if (!c.length) { m.className = 'msg err'; m.textContent = 'Choisis au moins une catégorie.'; return; }
    if (!$('#waiver').checked) { m.className = 'msg err'; m.textContent = 'Coche la case sur l’accès immédiat pour continuer.'; return; }
    if (ref.length < 4) { m.className = 'msg err'; m.textContent = 'Indique la référence de ton paiement pour qu’on le retrouve.'; return; }
    $('#send').disabled = true;
    const { error } = await NT.sb.from('subscriptions').insert({ user_id: u.id, categories: c, methode: method(), reference: ref.slice(0, 200) });
    $('#send').disabled = false;
    if (error) { m.className = 'msg err'; m.textContent = error.message; return; }
    m.className = 'msg ok'; m.textContent = 'Demande envoyée ! Ton accès s’ouvre dès la vérification du paiement.';
    setTimeout(main, 1500);
  };
}
if (NT.sb) NT.sb.auth.onAuthStateChange(async (ev) => {
  if (ev === 'PASSWORD_RECOVERY') { const np = prompt('Choisis ton nouveau mot de passe (8 caractères minimum) :'); if (np && np.length >= 8) { const { error } = await NT.sb.auth.updateUser({ password: np }); alert(error ? error.message : 'Mot de passe changé.'); } main(); }
});
main();
</script>
</body>
</html>
